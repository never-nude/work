<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kushman.work</title>
    <meta
      name="description"
      content="The GitHub Pages home for kushman.work."
    >
    <style>
      :root {
        color-scheme: light dark;
        --ink: #171717;
        --paper: #f7f2ea;
        --accent: #1f7a68;
        --accent-2: #b43f32;
        --line: rgba(23, 23, 23, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 18%, rgba(31, 122, 104, 0.16), transparent 32rem),
          radial-gradient(circle at 80% 84%, rgba(180, 63, 50, 0.14), transparent 26rem),
          var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 2rem, 52rem);
        padding: clamp(2rem, 7vw, 5rem) 0;
      }

      .mark {
        width: 5.25rem;
        aspect-ratio: 1;
        margin-bottom: 2rem;
        border: 1px solid var(--line);
        border-radius: 50%;
        background:
          linear-gradient(135deg, transparent 45%, var(--accent) 46% 54%, transparent 55%),
          linear-gradient(45deg, transparent 44%, var(--accent-2) 45% 55%, transparent 56%);
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(3.5rem, 12vw, 9rem);
        line-height: 0.9;
        font-weight: 750;
        letter-spacing: 0;
      }

      p {
        max-width: 36rem;
        margin: 1.5rem 0 0;
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        line-height: 1.55;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5efe6;
          --paper: #171717;
          --line: rgba(245, 239, 230, 0.18);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>kushman.work</h1>
      <p>This site is wired up and ready for the work that comes next.</p>
    </main>
  </body>
</html>
