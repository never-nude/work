name: GoLive build

on:
  push:
    paths:
      - "GoLive/**"
      - ".github/workflows/golive-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for iOS (no signing)
        working-directory: GoLive
        run: |
          set -o pipefail
          xcodebuild -project GoLive.xcodeproj -scheme GoLive \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: GoLive/build.log
