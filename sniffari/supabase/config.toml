# Supabase project config (used by `supabase config push` in scripts/setup-social.sh).
project_id = "sniffari"

[auth]
site_url = "capacitor://localhost"
enable_signup = true

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 3600

# Sign-in emails carry a 6-digit code the app asks for (no magic links to open).
[auth.email.template.magic_link]
subject = "Your Sniffari code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Your Sniffari code"
content_path = "./supabase/templates/magic_link.html"

[functions.notify-walk]
verify_jwt = true
